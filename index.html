<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BACK PRIME</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Telegram Web App -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <!-- Chart.js для диаграмм -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        * { word-break: break-word; overflow-wrap: break-word; }
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-thumb { background: #c084fc; border-radius: 4px; }
        
        /* Сочное матовое стекло с яркими неоновыми контурами */
        .glass-panel {
            background: rgba(18, 16, 30, 0.85);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(192, 132, 252, 0.2);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8), inset 0 1px 0 rgba(255, 255, 255, 0.15);
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .glass-panel:hover {
            border-color: rgba(192, 132, 252, 0.5);
            box-shadow: 0 25px 60px rgba(139, 92, 246, 0.15), inset 0 1px 0 rgba(255, 255, 255, 0.25);
        }

        .tab-container {
            position: relative;
            min-height: 520px;
        }
        .tab-content {
            opacity: 0;
            transform: translateY(12px) scale(0.99);
            pointer-events: none;
            transition: opacity 0.35s cubic-bezier(0.16, 1, 0.3, 1), transform 0.35s cubic-bezier(0.16, 1, 0.3, 1);
            position: absolute;
            width: 100%;
            top: 0;
            left: 0;
        }
        .tab-content.active {
            opacity: 1;
            transform: translateY(0) scale(1);
            pointer-events: auto;
            position: relative;
        }

        .rotate-arrow {
            transform: rotate(180deg);
        }

        /* Плавный разблокировщик */
        #lock-screen {
            transition: opacity 0.6s cubic-bezier(0.16, 1, 0.3, 1), transform 0.6s cubic-bezier(0.16, 1, 0.3, 1), filter 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }
        #lock-screen.unlocking {
            opacity: 0;
            transform: scale(1.12);
            filter: blur(12px);
            pointer-events: none;
        }

        /* Глубокий, насыщенный фон с кибер-сеткой и неоновыми переливами */
        body {
            background-color: #05050a;
            background-image: 
                radial-gradient(circle at 50% -15%, rgba(147, 51, 234, 0.45) 0%, rgba(20, 15, 35, 0.6) 40%, transparent 70%),
                radial-gradient(circle at 10% 90%, rgba(219, 39, 119, 0.25) 0%, transparent 50%),
                radial-gradient(circle at 90% 80%, rgba(99, 102, 241, 0.25) 0%, transparent 50%),
                linear-gradient(rgba(255, 255, 255, 0.02) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
            background-size: 100% 100%, 100% 100%, 100% 100%, 24px 24px, 24px 24px;
            overflow-x: hidden;
        }
    </style>
</head>
<body class="text-zinc-100 font-sans min-h-screen p-4 pb-28 selection:bg-purple-600 selection:text-white">

    <!-- СТАРТОВЫЙ ЭКРАН (КИБЕР-ЯДРО) -->
    <div id="lock-screen" class="fixed inset-0 bg-black z-50 flex flex-col items-center justify-center p-6 text-center select-none cursor-pointer">
        <div id="core-btn" class="relative w-40 h-40 flex items-center justify-center mb-8 rounded-full bg-violet-950/55 border-2 border-violet-400/60 shadow-[0_0_70px_rgba(168,85,247,0.5)] overflow-hidden transition-transform duration-300">
            <!-- Заполнение при зажатии сочным градиентом -->
            <div id="core-fill" class="absolute inset-0 rounded-full bg-gradient-to-tr from-violet-600 via-purple-600 to-fuchsia-600 scale-0 origin-center transition-transform duration-75"></div>
            <span class="relative z-10 text-4xl filter drop-shadow-[0_0_20px_rgba(255,255,255,0.9)]">⚡</span>
        </div>
        <h1 class="text-3xl font-black tracking-widest uppercase text-white drop-shadow-[0_0_25px_rgba(168,85,247,0.9)] mb-2">
            BACK <span class="text-transparent bg-clip-text bg-gradient-to-r from-violet-400 to-fuchsia-400">PRIME</span>
        </h1>
        <p class="text-xs text-zinc-300 uppercase tracking-[0.25em] font-bold">
            Зажми экран, чтобы войти
        </p>
    </div>

    <div class="max-w-md mx-auto relative">
        <!-- Шапка -->
        <header class="flex justify-between items-center mb-4 mt-2">
            <div>
                <h1 class="text-2xl font-black tracking-widest uppercase text-white drop-shadow-md">
                    BACK <span class="text-transparent bg-clip-text bg-gradient-to-r from-violet-400 to-fuchsia-400">PRIME</span>
                </h1>
                <p id="header-real-date" class="text-[10px] text-violet-300 uppercase tracking-widest font-bold mt-0.5">Загрузка...</p>
            </div>
            <div class="flex items-center gap-1.5">
                <div class="glass-panel text-fuchsia-300 px-2.5 py-1.5 rounded-full text-[10px] font-extrabold uppercase shadow-lg flex items-center gap-1 border-fuchsia-500/30">
                    🔥 <span id="streak-count">1</span> день
                </div>
                <div class="glass-panel text-emerald-400 px-3 py-1.5 rounded-full text-[11px] font-black tracking-widest uppercase shadow-lg border-emerald-500/30">
                    v16.0
                </div>
            </div>
        </header>

        <!-- ЦИТАТНИК -->
        <div class="glass-panel rounded-2xl p-3.5 mb-5 text-center relative overflow-hidden border-violet-500/30">
            <div class="absolute -right-10 -bottom-10 w-24 h-24 bg-fuchsia-600/20 rounded-full blur-2xl"></div>
            <p id="motivational-quote" class="text-[11px] font-medium text-zinc-200 italic tracking-wide">
                Мотивация загружается...
            </p>
        </div>

        <!-- Навигация -->
        <div class="grid grid-cols-3 gap-1.5 glass-panel p-1.5 rounded-2xl mb-6 relative z-10 border-violet-500/30">
            <button onclick="switchMainTab('planner')" id="m-tab-planner" class="py-2.5 text-xs font-bold rounded-xl bg-gradient-to-r from-violet-600 via-purple-600 to-fuchsia-600 text-white shadow-lg shadow-purple-600/40 uppercase tracking-wider transition-all duration-300">План дня</button>
            <button onclick="switchMainTab('workouts')" id="m-tab-workouts" class="py-2.5 text-xs font-bold rounded-xl text-zinc-400 hover:text-white uppercase tracking-wider transition-all duration-300">База</button>
            <button onclick="switchMainTab('stats')" id="m-tab-stats" class="py-2.5 text-xs font-bold rounded-xl text-zinc-400 hover:text-white uppercase tracking-wider transition-all duration-300">Статы</button>
        </div>

        <!-- КОНТЕЙНЕР ВКЛАДОК -->
        <div class="tab-container">
            
            <!-- РАЗДЕЛ 1: ПЛАН ДНЯ -->
            <div id="main-content-planner" class="tab-content active space-y-4">
                
                <!-- Дни недели -->
                <div class="flex gap-1.5 overflow-x-auto pb-1 no-scrollbar">
                    <button onclick="selectDay('mon')" id="day-btn-mon" class="flex-1 min-w-[42px] py-2.5 rounded-xl text-xs font-bold bg-zinc-900 text-zinc-400 transition-all duration-300">Пн</button>
                    <button onclick="selectDay('tue')" id="day-btn-tue" class="flex-1 min-w-[42px] py-2.5 rounded-xl text-xs font-bold bg-zinc-900 text-zinc-400 transition-all duration-300">Вт</button>
                    <button onclick="selectDay('wed')" id="day-btn-wed" class="flex-1 min-w-[42px] py-2.5 rounded-xl text-xs font-bold bg-zinc-900 text-zinc-400 transition-all duration-300">Ср</button>
                    <button onclick="selectDay('thu')" id="day-btn-thu" class="flex-1 min-w-[42px] py-2.5 rounded-xl text-xs font-bold bg-zinc-900 text-zinc-400 transition-all duration-300">Чт</button>
                    <button onclick="selectDay('fri')" id="day-btn-fri" class="flex-1 min-w-[42px] py-2.5 rounded-xl text-xs font-bold bg-zinc-900 text-zinc-400 transition-all duration-300">Пт</button>
                    <button onclick="selectDay('sat')" id="day-btn-sat" class="flex-1 min-w-[42px] py-2.5 rounded-xl text-xs font-bold bg-zinc-900 text-zinc-400 transition-all duration-300">Сб</button>
                    <button onclick="selectDay('sun')" id="day-btn-sun" class="flex-1 min-w-[42px] py-2.5 rounded-xl text-xs font-bold bg-zinc-900 text-zinc-400 transition-all duration-300">Вс</button>
                </div>

                <!-- Блок тренировки (сворачиваемый) -->
                <div class="glass-panel rounded-2xl p-4 space-y-3">
                    <div class="flex justify-between items-center cursor-pointer select-none" onclick="toggleWorkoutExpand()">
                        <div class="flex items-center gap-2.5">
                            <div class="w-8 h-8 rounded-xl bg-gradient-to-br from-violet-600 to-fuchsia-600 flex items-center justify-center text-white text-sm shadow-md">🏋️</div>
                            <h2 id="workout-header-title" class="text-xs font-bold text-violet-300 uppercase tracking-wider">Тренировка</h2>
                        </div>
                        <div id="workout-arrow" class="w-7 h-7 rounded-xl bg-black/50 border border-white/10 flex items-center justify-center text-zinc-300 text-xs transition-transform duration-300">
                            ▼
                        </div>
                    </div>
                    
                    <div id="day-workout-container" class="hidden text-sm text-zinc-300 pt-3 border-t border-white/10 space-y-2">
                        <!-- План тренировки -->
                    </div>
                </div>

                <!-- Задачи дня -->
                <div class="glass-panel rounded-2xl p-4 space-y-3">
                    <div class="flex justify-between items-center">
                        <h2 class="text-xs font-bold text-zinc-300 uppercase tracking-wider">Задачи на день</h2>
                        <button onclick="openTaskModal()" class="bg-gradient-to-r from-violet-600 to-fuchsia-600 hover:from-violet-500 hover:to-fuchsia-500 text-white px-3.5 py-1.5 rounded-xl font-bold text-xs shadow-md shadow-fuchsia-600/30 transition-all duration-300 active:scale-95">
                            ＋ Добавить задачу
                        </button>
                    </div>
                    <div id="day-tasks-list" class="space-y-2 pt-1">
                        <!-- Задачи -->
                    </div>
                </div>

            </div>

            <!-- РАЗДЕЛ 2: БАЗА ТРЕНИРОВОК -->
            <div id="main-content-workouts" class="tab-content space-y-4">
                <div class="flex justify-between items-center mb-1">
                    <h2 class="text-xs font-bold text-zinc-400 uppercase tracking-wider">База программ</h2>
                    <button onclick="openAddWorkoutModal()" class="text-xs text-fuchsia-400 hover:text-fuchsia-300 font-bold uppercase tracking-wider transition-colors duration-300">＋ Создать</button>
                </div>
                
                <div id="all-workouts-list" class="space-y-3">
                    <!-- Рендер всех тренировок с днями недели -->
                </div>

                <!-- Модалка создания программы -->
                <div id="add-workout-modal" class="hidden glass-panel rounded-2xl p-5 space-y-3 border-fuchsia-500/40">
                    <h3 class="text-sm font-bold text-white uppercase tracking-wider">Новая программа</h3>
                    <input type="text" id="newWorkoutName" placeholder="Название..." class="w-full bg-black/50 border border-white/10 rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:border-fuchsia-500 transition">
                    <textarea id="newWorkoutExercises" placeholder="Упражнения (каждое с новой строки):&#10;Жим лежа 3х10&#10;Сведение рук 3х12" rows="4" class="w-full bg-black/50 border border-white/10 rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:border-fuchsia-500 transition"></textarea>
                    <div class="flex gap-2 pt-1">
                        <button onclick="saveNewWorkout()" class="flex-1 bg-gradient-to-r from-violet-600 to-fuchsia-600 hover:from-violet-500 hover:to-fuchsia-500 text-white font-bold py-2.5 rounded-xl text-xs uppercase tracking-wider transition">Сохранить</button>
                        <button onclick="closeAddWorkoutModal()" class="px-4 bg-zinc-800 hover:bg-zinc-700 text-zinc-300 font-bold py-2.5 rounded-xl text-xs uppercase tracking-wider transition">Отмена</button>
                    </div>
                </div>
            </div>

            <!-- РАЗДЕЛ 3: СТАТИСТИКА -->
            <div id="main-content-stats" class="tab-content space-y-4">
                <div class="glass-panel rounded-2xl p-5 shadow-xl">
                    <h2 class="text-xs font-bold text-zinc-300 mb-4 uppercase tracking-wider text-center">Активность за неделю (Столбцы)</h2>
                    <div class="relative w-full h-60">
                        <canvas id="dailyBarChart"></canvas>
                    </div>
                </div>

                <div class="glass-panel rounded-2xl p-5 shadow-xl">
                    <h2 class="text-xs font-bold text-zinc-300 mb-4 uppercase tracking-wider text-center">Общий баланс</h2>
                    <div class="relative w-full h-48 flex justify-center items-center">
                        <canvas id="overallChart"></canvas>
                    </div>
                </div>

                <div class="glass-panel rounded-2xl p-4 space-y-3">
                    <h2 class="text-xs font-bold text-zinc-300 uppercase tracking-wider">История (Правка)</h2>
                    <div id="history-manage-list" class="space-y-2 max-h-40 overflow-y-auto"></div>
                </div>
            </div>

        </div>
    </div>

    <!-- МОДАЛЬНОЕ ОКНО ДОБАВЛЕНИЯ ЗАДАЧИ -->
    <div id="task-modal" class="hidden fixed inset-0 bg-black/85 backdrop-blur-md z-50 flex items-center justify-center p-4">
        <div class="glass-panel rounded-2xl p-5 w-full max-w-sm space-y-4 border-fuchsia-500/50 animate-in fade-in zoom-in duration-200">
            <h3 class="text-sm font-bold text-white uppercase tracking-wider">Новая задача на день</h3>
            <input type="text" id="modalTaskInput" placeholder="Введите текст задачи..." class="w-full bg-black/50 border border-white/15 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-fuchsia-500 transition">
            <div class="flex gap-2 pt-1">
                <button onclick="saveModalTask()" class="flex-1 bg-gradient-to-r from-violet-600 via-purple-600 to-fuchsia-600 hover:from-violet-500 hover:to-fuchsia-500 text-white font-bold py-2.5 rounded-xl text-xs uppercase tracking-wider shadow-lg shadow-fuchsia-600/30 transition">Добавить</button>
                <button onclick="closeTaskModal()" class="px-4 bg-zinc-800 hover:bg-zinc-700 text-zinc-300 font-bold py-2.5 rounded-xl text-xs uppercase tracking-wider transition">Отмена</button>
            </div>
        </div>
    </div>

    <!-- Логика -->
    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        function updateStreak() {
            let history = JSON.parse(localStorage.getItem('bp_history') || '[]');
            document.getElementById('streak-count').innerText = Math.max(1, history.length);
        }
        updateStreak();

        // --- ЛОГИКА ЗАПОЛНЯЮЩЕГОСЯ КРУЖКА ПРИ ЗАЖАТИИ ---
        const lockScreen = document.getElementById('lock-screen');
        const coreBtn = document.getElementById('core-btn');
        const coreFill = document.getElementById('core-fill');
        let holdStartTime = 0;
        let holdTimerInterval = null;
        const requiredHoldTime = 800;

        function startUnlock(e) {
            e.preventDefault();
            holdStartTime = Date.now();
            coreBtn.style.transform = 'scale(0.92)';

            holdTimerInterval = setInterval(() => {
                let elapsed = Date.now() - holdStartTime;
                let progress = Math.min(elapsed / requiredHoldTime, 1);
                
                coreFill.style.transform = `scale(${progress})`;

                if (progress >= 1) {
                    clearInterval(holdTimerInterval);
                    if (tg && tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
                    lockScreen.classList.add('unlocking');
                    setTimeout(() => lockScreen.remove(), 600);
                }
            }, 16);

            if (tg && tg.HapticFeedback) tg.HapticFeedback.impactOccurred('light');
        }

        function cancelUnlock(e) {
            if (!holdStartTime) return;
            clearInterval(holdTimerInterval);
            holdStartTime = 0;
            coreBtn.style.transform = 'scale(1)';
            coreFill.style.transform = 'scale(0)';
        }

        lockScreen.addEventListener('mousedown', startUnlock);
        lockScreen.addEventListener('touchstart', startUnlock, {passive: false});
        lockScreen.addEventListener('mouseup', cancelUnlock);
        lockScreen.addEventListener('touchend', cancelUnlock);
        lockScreen.addEventListener('mouseleave', cancelUnlock);

        // --- ДАТЫ И МИНСК ---
        function getMinskTime() {
            const now = new Date();
            const utc = now.getTime() + (now.getTimezoneOffset() * 60000);
            return new Date(utc + (3600000 * 3));
        }

        const dayKeys = ['sun', 'mon', 'tue', 'wed', 'thu', 'fri', 'sat'];
        const dayNamesShort = { mon: 'Пн', tue: 'Вт', wed: 'Ср', thu: 'Чт', fri: 'Пт', sat: 'Сб', sun: 'Вс' };
        const dayKeysOrder = ['mon', 'tue', 'wed', 'thu', 'fri', 'sat', 'sun'];

        const minskNow = getMinskTime();
        const currentRealDayKey = dayKeys[minskNow.getDay()];
        
        document.getElementById('header-real-date').innerText = minskNow.toLocaleDateString('ru-RU', { weekday: 'long', day: 'numeric', month: 'long' });

        let selectedDay = currentRealDayKey;
        let isWorkoutExpanded = false;

        function initDefaultSchedule() {
            let schedule = JSON.parse(localStorage.getItem('bp_schedule') || '{}');
            if (!schedule['mon']) schedule['mon'] = { workoutId: 'gym', checkedExercises: {} };
            if (!schedule['thu']) schedule['thu'] = { workoutId: 'gym', checkedExercises: {} };
            localStorage.setItem('bp_schedule', JSON.stringify(schedule));
        }
        initDefaultSchedule();

        const quotes = [
            "Дисциплина — это мост между твоими целями и достижениями.",
            "Боль временна, гордость за себя останется навсегда.",
            "Твое тело — это единственный дом, в котором тебе жить.",
            "Сегодня ты делаешь то, что другие не хотят, завтра живешь так, как другие не могут.",
            "Каждое повторение приближает тебя к твоей лучшей версии."
        ];
        document.getElementById('motivational-quote').innerText = `«${quotes[Math.floor(Math.random() * quotes.length)]}»`;

        let dailyChartInstance = null;
        let overallChartInstance = null;

        const defaultWorkouts = [
            { id: 'gym', isDefault: true, title: '🏋️ Университет (Гантели + Тренажеры)', tag: 'Зал', exercises: ['Жим от груди в тренажере (3х8-12)', 'Верхняя тяга к груди (3х8-12)', 'Приседания с гантелями (3х10-12)', 'Румынская тяга с гантелями (3х10-12)', 'Махи гантелями в стороны (3х12-15)'] },
            { id: 'home', isDefault: true, title: '🏠 Дом (Турник + Вес)', tag: 'Дом', exercises: ['Подтягивания на турнике (3-4х макс)', 'Отжимания от пола (4х12-20)', 'Болгарские выпады (3х10-12)', 'Планка (3х45-60 сек)', 'Скручивания на пресс (3х15-20)'] }
        ];

        function getWorkouts() {
            let custom = JSON.parse(localStorage.getItem('bp_custom_workouts') || '[]');
            return [...defaultWorkouts, ...custom];
        }

        function switchMainTab(tab) {
            ['planner', 'workouts', 'stats'].forEach(t => {
                const btn = document.getElementById(`m-tab-${t}`);
                const content = document.getElementById(`main-content-${t}`);
                if (t === tab) {
                    btn.className = "py-2.5 text-xs font-bold rounded-xl bg-gradient-to-r from-violet-600 via-purple-600 to-fuchsia-600 text-white shadow-lg shadow-fuchsia-600/40 uppercase tracking-wider transition-all duration-300";
                    content.classList.add('active');
                } else {
                    btn.className = "py-2.5 text-xs font-bold rounded-xl text-zinc-400 hover:text-white uppercase tracking-wider transition-all duration-300";
                    content.classList.remove('active');
                }
            });
            if (tab === 'workouts') renderAllWorkouts();
            if (tab === 'stats') {
                renderCharts();
                renderHistoryManager();
            }
            if (tg && tg.HapticFeedback) tg.HapticFeedback.selectionChanged();
        }

        // --- ПЛАН ДНЯ ---
        function selectDay(day) {
            selectedDay = day;
            isWorkoutExpanded = false;
            document.getElementById('day-workout-container').classList.add('hidden');
            document.getElementById('workout-arrow').classList.remove('rotate-arrow');

            dayKeysOrder.forEach(d => {
                const btn = document.getElementById(`day-btn-${d}`);
                if (d === day) {
                    btn.className = "flex-1 min-w-[42px] py-2.5 rounded-xl text-xs font-bold bg-gradient-to-r from-violet-600 to-fuchsia-600 text-white transition-all duration-300 shadow-lg shadow-fuchsia-600/30";
                } else {
                    btn.className = "flex-1 min-w-[42px] py-2.5 rounded-xl text-xs font-bold bg-zinc-900 text-zinc-400 transition-all duration-300";
                }
            });

            renderDayPlanner();
            if (tg && tg.HapticFeedback) tg.HapticFeedback.selectionChanged();
        }

        function toggleWorkoutExpand() {
            isWorkoutExpanded = !isWorkoutExpanded;
            const container = document.getElementById('day-workout-container');
            const arrow = document.getElementById('workout-arrow');
            if (isWorkoutExpanded) {
                container.classList.remove('hidden');
                arrow.classList.add('rotate-arrow');
            } else {
                container.classList.add('hidden');
                arrow.classList.remove('rotate-arrow');
            }
            if (tg && tg.HapticFeedback) tg.HapticFeedback.selectionChanged();
        }

        function renderDayPlanner() {
            const workouts = getWorkouts();
            let schedule = JSON.parse(localStorage.getItem('bp_schedule') || '{}');
            let assignedId = schedule[selectedDay]?.workoutId || '';
            const headerTitle = document.getElementById('workout-header-title');
            const wContainer = document.getElementById('day-workout-container');

            if (!assignedId) {
                headerTitle.innerText = "Тренировка: (Не назначена)";
                wContainer.innerHTML = `<p class="text-xs text-zinc-500 italic">На этот день тренировка не выбрана. Назначьте ее во вкладке «База».</p>`;
            } else {
                let w = workouts.find(item => item.id == assignedId);
                if (w) {
                    headerTitle.innerText = `${w.title}`;
                    let checkedMap = schedule[selectedDay]?.checkedExercises || {};
                    wContainer.innerHTML = `
                        <div class="space-y-1.5 pt-1">
                            ${w.exercises.map((ex, idx) => `
                                <div onclick="toggleDayExercise('${selectedDay}',${idx})" class="bg-black/40 border border-white/10 rounded-xl p-2.5 flex items-center gap-2.5 cursor-pointer hover:border-fuchsia-500/40 transition">
                                    <div class="w-4 h-4 rounded border ${checkedMap[idx] ? 'bg-emerald-600 border-emerald-600 text-white text-[10px] flex items-center justify-center' : 'border-white/25'}">${checkedMap[idx] ? '✓' : ''}</div>
                                    <span class="text-xs ${checkedMap[idx] ? 'line-through text-zinc-500' : 'text-zinc-200'}">${ex}</span>
                                </div>
                            `).join('')}
                        </div>
                        <button onclick="finishDayWorkout('${w.title}')" class="mt-3 w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-2.5 rounded-xl text-xs uppercase tracking-wider transition shadow-lg shadow-emerald-600/30">✅ Отметить выполненной</button>
                    `;
                }
            }
            renderDayTasks();
        }

        function toggleDayExercise(day, idx) {
            let schedule = JSON.parse(localStorage.getItem('bp_schedule') || '{}');
            if (!schedule[day]) schedule[day] = {};
            if (!schedule[day].checkedExercises) schedule[day].checkedExercises = {};
            schedule[day].checkedExercises[idx] = !schedule[day].checkedExercises[idx];
            localStorage.setItem('bp_schedule', JSON.stringify(schedule));
            renderDayPlanner();
        }

        function finishDayWorkout(wName) {
            let history = JSON.parse(localStorage.getItem('bp_history') || '[]');
            history.push({ id: Date.now(), type: 'workout', name: wName, date: minskNow.toISOString().split('T')[0] });
            localStorage.setItem('bp_history', JSON.stringify(history));
            updateStreak();
            if (tg && tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
            alert('🔥 Тренировка успешно зафиксирована в статистике!');
        }

        // --- МОДАЛЬНОЕ ОКНО ЗАДАЧ ---
        function openTaskModal() {
            document.getElementById('task-modal').classList.remove('hidden');
            document.getElementById('modalTaskInput').focus();
            if (tg && tg.HapticFeedback) tg.HapticFeedback.impactOccurred('light');
        }

        function closeTaskModal() {
            document.getElementById('task-modal').classList.add('hidden');
            document.getElementById('modalTaskInput').value = '';
        }

        function saveModalTask() {
            const input = document.getElementById('modalTaskInput');
            const text = input.value.trim();
            if (!text) return;
            
            let tasks = JSON.parse(localStorage.getItem(`bp_tasks_${selectedDay}`) || '[]');
            tasks.unshift({ id: Date.now(), text, completed: false });
            localStorage.setItem(`bp_tasks_${selectedDay}`, JSON.stringify(tasks));
            
            closeTaskModal();
            renderDayTasks();
            if (tg && tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
        }

        function toggleDayTask(id) {
            let tasks = JSON.parse(localStorage.getItem(`bp_tasks_${selectedDay}`) || '[]');
            tasks = tasks.map(t => { if (t.id === id) t.completed = !t.completed; return t; });
            localStorage.setItem(`bp_tasks_${selectedDay}`, JSON.stringify(tasks));
            renderDayTasks();
            if (tg && tg.HapticFeedback) tg.HapticFeedback.impactOccurred('medium');
        }

        function deleteDayTask(id) {
            let tasks = JSON.parse(localStorage.getItem(`bp_tasks_${selectedDay}`) || '[]');
            tasks = tasks.filter(t => t.id !== id);
            localStorage.setItem(`bp_tasks_${selectedDay}`, JSON.stringify(tasks));
            renderDayTasks();
            if (tg && tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('warning');
        }

        function renderDayTasks() {
            const listEl = document.getElementById('day-tasks-list');
            let tasks = JSON.parse(localStorage.getItem(`bp_tasks_${selectedDay}`) || '[]');
            if (tasks.length === 0) {
                listEl.innerHTML = `<p class="text-xs text-zinc-500 italic">Нет задач на этот день</p>`;
                return;
            }
            listEl.innerHTML = tasks.map(t => `
                <div class="bg-black/40 border border-white/10 rounded-xl p-2.5 flex justify-between items-center gap-2 ${t.completed ? 'opacity-50' : ''} transition">
                    <div class="flex items-center gap-2 flex-1 cursor-pointer" onclick="toggleDayTask(${t.id})">
                        <div class="w-4 h-4 rounded border ${t.completed ? 'bg-emerald-600 border-emerald-600 text-white text-[10px] flex items-center justify-center' : 'border-white/25'}">${t.completed ? '✓' : ''}</div>
                        <span class="text-xs ${t.completed ? 'line-through text-zinc-500' : 'text-zinc-200'}">${t.text}</span>
                    </div>
                    <button onclick="deleteDayTask(${t.id})" class="text-zinc-500 hover:text-red-400 text-xs px-1 transition-colors">✕</button>
                </div>
            `).join('');
        }

        // --- БАЗА ТРЕНИРОВОК ---
        function renderAllWorkouts() {
            const container = document.getElementById('all-workouts-list');
            const workouts = getWorkouts();
            let schedule = JSON.parse(localStorage.getItem('bp_schedule') || '{}');

            container.innerHTML = workouts.map(w => {
                let assignedDays = dayKeysOrder.filter(d => schedule[d]?.workoutId === w.id);
                return `
                    <div class="glass-panel rounded-2xl p-4 space-y-3">
                        <div class="flex justify-between items-start">
                            <div>
                                <span class="text-[10px] text-fuchsia-400 uppercase font-bold">${w.tag || 'Своя'}</span>
                                <h3 class="text-sm font-bold text-white">${w.title}</h3>
                            </div>
                            ${!w.isDefault ? `<button onclick="deleteWorkout('${w.id}')" class="text-zinc-500 hover:text-red-400 text-xs p-1 transition-colors">Удалить</button>` : ''}
                        </div>
                        
                        <div class="text-xs text-zinc-400 bg-black/40 p-2.5 rounded-xl space-y-1 border border-white/10">
                            <p class="font-bold text-zinc-300">План упражнений:</p>
                            <ul class="list-disc list-inside text-[11px] space-y-0.5 text-zinc-400">
                                ${w.exercises.map(ex => `<li>${ex}</li>`).join('')}
                            </ul>
                        </div>

                        <div>
                            <p class="text-[10px] text-zinc-400 uppercase font-bold mb-1.5">Назначить на дни недели:</p>
                            <div class="flex gap-1">
                                ${dayKeysOrder.map(d => {
                                    let isAssigned = assignedDays.includes(d);
                                    return `
                                        <button onclick="toggleWorkoutDay('${w.id}', '${d}')" class="flex-1 py-1.5 rounded-lg text-xs font-bold transition-all duration-300 ${isAssigned ? 'bg-gradient-to-r from-violet-600 to-fuchsia-600 text-white shadow-md shadow-fuchsia-600/30' : 'bg-zinc-900 text-zinc-500 hover:text-zinc-300'}">
                                            ${dayNamesShort[d]}
                                        </button>
                                    `;
                                }).join('')}
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function toggleWorkoutDay(wId, day) {
            let schedule = JSON.parse(localStorage.getItem('bp_schedule') || '{}');
            if (!schedule[day]) schedule[day] = {};
            
            if (schedule[day].workoutId === wId) {
                schedule[day].workoutId = "";
                schedule[day].checkedExercises = {};
            } else {
                schedule[day].workoutId = wId;
                schedule[day].checkedExercises = {};
            }
            localStorage.setItem('bp_schedule', JSON.stringify(schedule));
            renderAllWorkouts();
            if (tg && tg.HapticFeedback) tg.HapticFeedback.selectionChanged();
        }

        function openAddWorkoutModal() { document.getElementById('add-workout-modal').classList.remove('hidden'); }
        function closeAddWorkoutModal() { document.getElementById('add-workout-modal').classList.add('hidden'); }

        function saveNewWorkout() {
            const name = document.getElementById('newWorkoutName').value.trim();
            const text = document.getElementById('newWorkoutExercises').value.trim();
            if (!name || !text) return;
            const exercises = text.split('\n').filter(Boolean);
            let custom = JSON.parse(localStorage.getItem('bp_custom_workouts') || '[]');
            custom.push({ id: 'custom_' + Date.now(), isDefault: false, title: name, tag: 'Своя', exercises });
            localStorage.setItem('bp_custom_workouts', JSON.stringify(custom));
            document.getElementById('newWorkoutName').value = '';
            document.getElementById('newWorkoutExercises').value = '';
            closeAddWorkoutModal();
            renderAllWorkouts();
        }

        function deleteWorkout(id) {
            if (!confirm('Удалить эту программу?')) return;
            let custom = JSON.parse(localStorage.getItem('bp_custom_workouts') || '[]');
            custom = custom.filter(w => w.id !== id);
            localStorage.setItem('bp_custom_workouts', JSON.stringify(custom));
            
            let schedule = JSON.parse(localStorage.getItem('bp_schedule') || '{}');
            dayKeysOrder.forEach(d => {
                if (schedule[d]?.workoutId === id) schedule[d].workoutId = "";
            });
            localStorage.setItem('bp_schedule', JSON.stringify(schedule));
            renderAllWorkouts();
        }

        // --- СТАТИСТИКА ---
        function renderHistoryManager() {
            const listEl = document.getElementById('history-manage-list');
            let history = JSON.parse(localStorage.getItem('bp_history') || '[]');
            if (history.length === 0) {
                listEl.innerHTML = `<p class="text-xs text-zinc-500 text-center py-2">Нет записанных тренировок</p>`;
                return;
            }
            listEl.innerHTML = history.slice(-5).reverse().map(item => `
                <div class="bg-black/40 border border-white/10 rounded-xl p-2.5 flex justify-between items-center text-xs">
                    <div>
                        <p class="font-bold text-zinc-200">${item.name}</p>
                        <p class="text-[10px] text-zinc-500">${item.date}</p>
                    </div>
                    <button onclick="deleteHistoryItem(${item.id})" class="text-zinc-500 hover:text-red-400 p-1 font-bold transition-colors">✕</button>
                </div>
            `).join('');
        }

        function deleteHistoryItem(id) {
            let history = JSON.parse(localStorage.getItem('bp_history') || '[]');
            history = history.filter(h => h.id !== id);
            localStorage.setItem('bp_history', JSON.stringify(history));
            updateStreak();
            renderHistoryManager();
            renderCharts();
            if (tg && tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('warning');
        }

        function renderCharts() {
            let history = JSON.parse(localStorage.getItem('bp_history') || '[]');
            let workoutsCount = history.filter(h => h.type === 'workout').length;

            let completedByDay = [0,0,0,0,0,0,0];
            let uncompletedByDay = [0,0,0,0,0,0,0];

            dayKeysOrder.forEach((dKey, index) => {
                let tasks = JSON.parse(localStorage.getItem(`bp_tasks_${dKey}`) || '[]');
                tasks.forEach(t => {
                    if (t.completed) {
                        completedByDay[index]++;
                    } else {
                        uncompletedByDay[index]++;
                    }
                });
            });

            const overallCtx = document.getElementById('overallChart').getContext('2d');
            if (overallChartInstance) overallChartInstance.destroy();
            overallChartInstance = new Chart(overallCtx, {
                type: 'doughnut',
                data: {
                    labels: ['Тренировки', 'Вып. задачи', 'Невып. задачи'],
                    datasets: [{ 
                        data: [workoutsCount, completedByDay.reduce((a,b)=>a+b,0), uncompletedByDay.reduce((a,b)=>a+b,0)], 
                        backgroundColor: ['#c084fc', '#10b981', '#ef4444'], 
                        borderWidth: 0 
                    }]
                },
                options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'bottom', labels: { color: '#a1a1aa', font: { size: 10 } } } } }
            });

            const dailyCtx = document.getElementById('dailyBarChart').getContext('2d');
            if (dailyChartInstance) dailyChartInstance.destroy();
            dailyChartInstance = new Chart(dailyCtx, {
                type: 'bar',
                data: {
                    labels: ['Пн', 'Вт', 'Ср', 'Чт', 'Пт', 'Сб', 'Вс'],
                    datasets: [
                        { label: 'Выполнено задач', data: completedByDay, backgroundColor: '#10b981', borderRadius: 6 },
                        { label: 'Не выполнено', data: uncompletedByDay, backgroundColor: '#ef4444', borderRadius: 6 }
                    ]
                },
                options: { 
                    responsive: true, 
                    maintainAspectRatio: false, 
                    scales: { 
                        x: { stacked: true, ticks: { color: '#71717a' }, grid: { display: false } }, 
                        y: { stacked: true, ticks: { color: '#71717a', stepSize: 1 }, grid: { color: 'rgba(255,255,255,0.05)' } } 
                    }, 
                    plugins: { legend: { position: 'bottom', labels: { color: '#a1a1aa', font: { size: 10 } } } } 
                }
            });
        }

        // Старт
        selectDay(currentRealDayKey);
    </script>
</body>
</html>

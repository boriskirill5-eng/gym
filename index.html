<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BACK PRIME</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Telegram Web App -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <!-- Chart.js для диаграмм -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-thumb { background: #8b5cf6; border-radius: 4px; }
        
        .glass-panel {
            background: rgba(15, 15, 23, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 10px 30px 0 rgba(0, 0, 0, 0.5);
        }

        .tab-content { display: none; }
        .tab-content.active { display: block; }

        #splash-screen {
            animation: splashFade 0.4s ease 1s forwards;
        }
        @keyframes splashFade {
            0% { opacity: 1; visibility: visible; }
            100% { opacity: 0; visibility: hidden; }
        }

        body {
            background: radial-gradient(circle at 50% 0%, #1e1b4b 0%, #09090b 60%, #000000 100%);
            overflow-x: hidden;
        }
    </style>
</head>
<body class="text-zinc-100 font-sans min-h-screen p-4 pb-28 selection:bg-violet-600 selection:text-white">

    <!-- СПЛЭШ-ЭКРАН -->
    <div id="splash-screen" class="fixed inset-0 bg-black z-50 flex flex-col items-center justify-center p-6 text-center">
        <div class="relative">
            <div class="absolute -inset-4 bg-violet-600/30 rounded-full blur-2xl animate-pulse"></div>
            <h1 class="relative text-4xl font-black tracking-widest uppercase text-white">
                BACK <span class="text-violet-500">PRIME</span>
            </h1>
        </div>
        <p id="splash-date" class="text-xs text-zinc-400 uppercase tracking-[0.2em] mt-3 font-bold">Синхронизация по Минску...</p>
    </div>

    <div class="max-w-md mx-auto relative">
        <!-- Шапка -->
        <header class="flex justify-between items-center mb-3 mt-2">
            <div>
                <h1 class="text-2xl font-black tracking-widest uppercase text-white">BACK <span class="text-violet-400">PRIME</span></h1>
                <p id="header-real-date" class="text-[10px] text-violet-400 uppercase tracking-widest font-bold">Загрузка даты...</p>
            </div>
            <div class="glass-panel text-emerald-400 px-3 py-1 rounded-full text-xs font-black tracking-widest uppercase">
                LIVE
            </div>
        </header>

        <!-- ЦИТАТНИК -->
        <div class="glass-panel rounded-2xl p-3 mb-5 text-center relative overflow-hidden">
            <p id="motivational-quote" class="text-[11px] font-medium text-zinc-300 italic">
                Загрузка мотивации...
            </p>
        </div>

        <!-- Навигация -->
        <div class="grid grid-cols-3 gap-1.5 glass-panel p-1.5 rounded-2xl mb-6 relative z-10">
            <button onclick="switchMainTab('planner')" id="m-tab-planner" class="py-2.5 text-xs font-bold rounded-xl bg-gradient-to-r from-violet-600 to-indigo-600 text-white shadow-lg uppercase tracking-wider">План дня</button>
            <button onclick="switchMainTab('workouts')" id="m-tab-workouts" class="py-2.5 text-xs font-bold rounded-xl text-zinc-400 hover:text-white uppercase tracking-wider">База</button>
            <button onclick="switchMainTab('stats')" id="m-tab-stats" class="py-2.5 text-xs font-bold rounded-xl text-zinc-400 hover:text-white uppercase tracking-wider">Статы</button>
        </div>

        <!-- РАЗДЕЛ 1: ПЛАНЕР (ПРИВЯЗАН К РЕАЛЬНОМУ ВРЕМЕНИ МИНСКА) -->
        <div id="main-content-planner" class="tab-content active space-y-4">
            
            <!-- Переключатель дней недели (с индикатором СЕГОДНЯ) -->
            <div class="flex gap-1 overflow-x-auto pb-1 no-scrollbar">
                <button onclick="selectDay('mon')" id="day-btn-mon" class="flex-1 min-w-[42px] py-2.5 rounded-xl text-xs font-bold bg-zinc-900 text-zinc-400 transition">Пн</button>
                <button onclick="selectDay('tue')" id="day-btn-tue" class="flex-1 min-w-[42px] py-2.5 rounded-xl text-xs font-bold bg-zinc-900 text-zinc-400 transition">Вт</button>
                <button onclick="selectDay('wed')" id="day-btn-wed" class="flex-1 min-w-[42px] py-2.5 rounded-xl text-xs font-bold bg-zinc-900 text-zinc-400 transition">Ср</button>
                <button onclick="selectDay('thu')" id="day-btn-thu" class="flex-1 min-w-[42px] py-2.5 rounded-xl text-xs font-bold bg-zinc-900 text-zinc-400 transition">Чт</button>
                <button onclick="selectDay('fri')" id="day-btn-fri" class="flex-1 min-w-[42px] py-2.5 rounded-xl text-xs font-bold bg-zinc-900 text-zinc-400 transition">Пт</button>
                <button onclick="selectDay('sat')" id="day-btn-sat" class="flex-1 min-w-[42px] py-2.5 rounded-xl text-xs font-bold bg-zinc-900 text-zinc-400 transition">Сб</button>
                <button onclick="selectDay('sun')" id="day-btn-sun" class="flex-1 min-w-[42px] py-2.5 rounded-xl text-xs font-bold bg-zinc-900 text-zinc-400 transition">Вс</button>
            </div>

            <!-- Плашка текущего дня -->
            <div id="today-banner" class="hidden bg-violet-600/20 border border-violet-500/40 rounded-xl px-4 py-2 flex justify-between items-center text-xs text-violet-300 font-bold">
                <span>🔥 Сегодня по расписанию</span>
                <span id="today-label">Университетский день</span>
            </div>

            <!-- Тренировка на выбранный день -->
            <div class="glass-panel rounded-2xl p-4 space-y-3">
                <div class="flex justify-between items-center">
                    <h2 class="text-xs font-bold text-violet-400 uppercase tracking-wider">Тренировка</h2>
                    <select id="dayWorkoutSelect" onchange="assignWorkoutToDay(this.value)" class="bg-black/50 border border-white/10 rounded-lg px-2.5 py-1 text-xs text-white focus:outline-none">
                        <option value="">(Без тренировки)</option>
                    </select>
                </div>
                <div id="day-workout-container" class="text-sm text-zinc-300">
                    <!-- План тренировки -->
                </div>
            </div>

            <!-- Задачи на выбранный день -->
            <div class="glass-panel rounded-2xl p-4 space-y-3">
                <h2 class="text-xs font-bold text-zinc-300 uppercase tracking-wider">Задачи на день</h2>
                <div class="flex gap-2">
                    <input type="text" id="dayTaskInput" placeholder="Добавить задачу на этот день..." class="flex-1 bg-black/40 border border-white/10 rounded-xl px-4 py-2 text-sm text-white focus:outline-none focus:border-violet-500">
                    <button onclick="addDayTask()" class="bg-violet-600 text-white px-4 rounded-xl font-bold text-sm">＋</button>
                </div>
                <div id="day-tasks-list" class="space-y-2 pt-1">
                    <!-- Задачи -->
                </div>
            </div>

        </div>

        <!-- РАЗДЕЛ 2: БАЗА ТРЕНИРОВОК -->
        <div id="main-content-workouts" class="tab-content space-y-4">
            <div class="flex justify-between items-center mb-1">
                <h2 class="text-xs font-bold text-zinc-400 uppercase tracking-wider">Все программы</h2>
                <button onclick="openAddWorkoutModal()" class="text-xs text-violet-400 font-bold uppercase tracking-wider">＋ Создать</button>
            </div>
            <div id="all-workouts-list" class="space-y-2.5"></div>

            <div id="add-workout-modal" class="hidden glass-panel rounded-2xl p-5 space-y-3 border-violet-500/40">
                <h3 class="text-sm font-bold text-white uppercase tracking-wider">Новая программа</h3>
                <input type="text" id="newWorkoutName" placeholder="Название..." class="w-full bg-black/40 border border-white/10 rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:border-violet-500">
                <textarea id="newWorkoutExercises" placeholder="Упражнения (каждое с новой строки):&#10;Упр 1&#10;Упр 2" rows="4" class="w-full bg-black/40 border border-white/10 rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:border-violet-500"></textarea>
                <div class="flex gap-2 pt-1">
                    <button onclick="saveNewWorkout()" class="flex-1 bg-violet-600 text-white font-bold py-2.5 rounded-xl text-xs uppercase tracking-wider">Сохранить</button>
                    <button onclick="closeAddWorkoutModal()" class="px-4 bg-zinc-800 text-zinc-300 font-bold py-2.5 rounded-xl text-xs uppercase tracking-wider">Отмена</button>
                </div>
            </div>
        </div>

        <!-- РАЗДЕЛ 3: СТАТИСТИКА -->
        <div id="main-content-stats" class="tab-content space-y-4">
            <div class="glass-panel rounded-2xl p-5 shadow-xl">
                <h2 class="text-xs font-bold text-zinc-300 mb-4 uppercase tracking-wider text-center">Активность</h2>
                <div class="relative w-full h-56">
                    <canvas id="dailyChart"></canvas>
                </div>
            </div>

            <div class="glass-panel rounded-2xl p-5 shadow-xl">
                <h2 class="text-xs font-bold text-zinc-300 mb-4 uppercase tracking-wider text-center">Баланс</h2>
                <div class="relative w-full h-48 flex justify-center items-center">
                    <canvas id="overallChart"></canvas>
                </div>
            </div>

            <div class="glass-panel rounded-2xl p-4 space-y-3">
                <h2 class="text-xs font-bold text-zinc-300 uppercase tracking-wider">История (Правка)</h2>
                <div id="history-manage-list" class="space-y-2 max-h-40 overflow-y-auto"></div>
            </div>
        </div>
    </div>

    <!-- Логика реального времени (Минск UTC+3) -->
    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        // Получаем реальную дату и день недели по Минску (UTC+3)
        function getMinskTime() {
            const now = new Date();
            const utc = now.getTime() + (now.getTimezoneOffset() * 60000);
            const minskDate = new Date(utc + (3600000 * 3));
            return minskDate;
        }

        const dayKeys = ['sun', 'mon', 'tue', 'wed', 'thu', 'fri', 'sat'];
        const dayNames = { mon: 'Понедельник', tue: 'Вторник', wed: 'Среда', thu: 'Четверг', fri: 'Пятница', sat: 'Суббота', sun: 'Воскресенье' };
        
        const minskNow = getMinskTime();
        const currentRealDayKey = dayKeys[minskNow.getDay()];
        
        // Красивый вывод даты в шапку
        const options = { weekday: 'long', day: 'numeric', month: 'long' };
        document.getElementById('header-real-date').innerText = minskNow.toLocaleDateString('ru-RU', options);
        document.getElementById('splash-date').innerText = minskNow.toLocaleDateString('ru-RU', options);

        let selectedDay = currentRealDayKey;

        // Авто-привязка тренировок универа по умолчанию для пн и чт (если расписание еще пустое)
        function initDefaultSchedule() {
            let schedule = JSON.parse(localStorage.getItem('bp_schedule') || '{}');
            if (!schedule['mon'] && !schedule['thu']) {
                schedule['mon'] = { workoutId: 'gym', checkedExercises: {} };
                schedule['thu'] = { workoutId: 'gym', checkedExercises: {} };
                localStorage.setItem('bp_schedule', JSON.stringify(schedule));
            }
        }
        initDefaultSchedule();

        // Цитаты
        const quotes = [
            "Дисциплина — это мост между твоими целями и достижениями.",
            "Боль временна, гордость за себя останется навсегда.",
            "Твое тело — это единственный дом, в котором тебе жить.",
            "Сегодня ты делаешь то, что другие не хотят, завтра живешь так, как другие не могут.",
            "Каждое повторение приближает тебя к твоей лучшей версии."
        ];
        document.getElementById('motivational-quote').innerText = `«${quotes[Math.floor(Math.random() * quotes.length)]}»`;

        let dailyChartInstance = null;
        let overallChartInstance = null;

        const defaultWorkouts = [
            { id: 'gym', isDefault: true, title: '🏋️ Университет (Гантели + Тренажеры)', tag: 'Зал', exercises: ['Жим от груди в тренажере (3х8-12)', 'Верхняя тяга к груди (3х8-12)', 'Приседания с гантелями (3х10-12)', 'Румынская тяга с гантелями (3х10-12)', 'Махи гантелями в стороны (3х12-15)'] },
            { id: 'home', isDefault: true, title: '🏠 Дом (Турник + Вес)', tag: 'Дом', exercises: ['Подтягивания на турнике (3-4х макс)', 'Отжимания от пола (4х12-20)', 'Болгарские выпады (3х10-12)', 'Планка (3х45-60 сек)', 'Скручивания на пресс (3х15-20)'] }
        ];

        function getWorkouts() {
            let custom = JSON.parse(localStorage.getItem('bp_custom_workouts') || '[]');
            return [...defaultWorkouts, ...custom];
        }

        function switchMainTab(tab) {
            ['planner', 'workouts', 'stats'].forEach(t => {
                const btn = document.getElementById(`m-tab-${t}`);
                const content = document.getElementById(`main-content-${t}`);
                if (t === tab) {
                    btn.className = "py-2.5 text-xs font-bold rounded-xl bg-gradient-to-r from-violet-600 to-indigo-600 text-white shadow-lg uppercase tracking-wider";
                    content.classList.add('active');
                } else {
                    btn.className = "py-2.5 text-xs font-bold rounded-xl text-zinc-400 hover:text-white uppercase tracking-wider";
                    content.classList.remove('active');
                }
            });
            if (tab === 'stats') {
                renderCharts();
                renderHistoryManager();
            }
        }

        // --- ПЛАНЕР ---
        function selectDay(day) {
            selectedDay = day;
            ['mon','tue','wed','thu','fri','sat','sun'].forEach(d => {
                const btn = document.getElementById(`day-btn-${d}`);
                if (d === day) {
                    btn.className = "flex-1 min-w-[42px] py-2.5 rounded-xl text-xs font-bold bg-violet-600 text-white transition shadow-lg shadow-violet-600/30";
                } else {
                    btn.className = "flex-1 min-w-[42px] py-2.5 rounded-xl text-xs font-bold bg-zinc-900 text-zinc-400 transition";
                }
            });

            // Показываем плашку, если выбран реальный сегодняшний день
            const banner = document.getElementById('today-banner');
            if (day === currentRealDayKey) {
                banner.classList.remove('hidden');
                document.getElementById('today-label').innerText = `${dayNames[day]} (Сегодня)`;
            } else {
                banner.classList.add('hidden');
            }

            renderDayPlanner();
        }

        function renderDayPlanner() {
            const select = document.getElementById('dayWorkoutSelect');
            const workouts = getWorkouts();
            let schedule = JSON.parse(localStorage.getItem('bp_schedule') || '{}');
            let assignedId = schedule[selectedDay]?.workoutId || '';

            select.innerHTML = `<option value="">(Без тренировки)</option>` + workouts.map(w => `
                <option value="${w.id}" ${assignedId === w.id ? 'selected' : ''}>${w.title}</option>
            `).join('');

            const wContainer = document.getElementById('day-workout-container');
            if (!assignedId) {
                wContainer.innerHTML = `<p class="text-xs text-zinc-500 italic">На этот день тренировка не назначена</p>`;
            } else {
                let w = workouts.find(item => item.id == assignedId);
                if (w) {
                    let checkedMap = schedule[selectedDay]?.checkedExercises || {};
                    wContainer.innerHTML = `
                        <p class="font-bold text-white mb-2">${w.title}</p>
                        <div class="space-y-1.5">
                            ${w.exercises.map((ex, idx) => `
                                <div onclick="toggleDayExercise('${selectedDay}',${idx})" class="bg-black/30 border border-white/5 rounded-lg p-2.5 flex items-center gap-2.5 cursor-pointer">
                                    <div class="w-4 h-4 rounded border ${checkedMap[idx] ? 'bg-emerald-600 border-emerald-600 text-white text-[10px] flex items-center justify-center' : 'border-white/20'}">${checkedMap[idx] ? '✓' : ''}</div>
                                    <span class="text-xs ${checkedMap[idx] ? 'line-through text-zinc-500' : 'text-zinc-200'}">${ex}</span>
                                </div>
                            `).join('')}
                        </div>
                        <button onclick="finishDayWorkout('${w.title}')" class="mt-3 w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-2 rounded-xl text-xs uppercase tracking-wider">✅ Отметить выполненной</button>
                    `;
                }
            }
            renderDayTasks();
        }

        function assignWorkoutToDay(wId) {
            let schedule = JSON.parse(localStorage.getItem('bp_schedule') || '{}');
            if (!schedule[selectedDay]) schedule[selectedDay] = {};
            schedule[selectedDay].workoutId = wId;
            schedule[selectedDay].checkedExercises = {};
            localStorage.setItem('bp_schedule', JSON.stringify(schedule));
            renderDayPlanner();
        }

        function toggleDayExercise(day, idx) {
            let schedule = JSON.parse(localStorage.getItem('bp_schedule') || '{}');
            if (!schedule[day]) schedule[day] = {};
            if (!schedule[day].checkedExercises) schedule[day].checkedExercises = {};
            schedule[day].checkedExercises[idx] = !schedule[day].checkedExercises[idx];
            localStorage.setItem('bp_schedule', JSON.stringify(schedule));
            renderDayPlanner();
        }

        function finishDayWorkout(wName) {
            let history = JSON.parse(localStorage.getItem('bp_history') || '[]');
            history.push({ id: Date.now(), type: 'workout', name: wName, date: minskNow.toISOString().split('T')[0] });
            localStorage.setItem('bp_history', JSON.stringify(history));
            if (tg && tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
            alert('🔥 Тренировка успешно зафиксирована в статистике!');
        }

        // Задачи дня
        function getDayTasks() { return JSON.parse(localStorage.getItem(`bp_tasks_${selectedDay}`) || '[]'); }
        function saveDayTasks(tasks) { localStorage.setItem(`bp_tasks_${selectedDay}`, JSON.stringify(tasks)); renderDayTasks(); }

        function addDayTask() {
            const input = document.getElementById('dayTaskInput');
            const text = input.value.trim();
            if (!text) return;
            let tasks = getDayTasks();
            tasks.unshift({ id: Date.now(), text, completed: false });
            input.value = '';
            saveDayTasks(tasks);
        }

        function toggleDayTask(id) {
            let tasks = getDayTasks();
            tasks = tasks.map(t => { if (t.id === id) t.completed = !t.completed; return t; });
            saveDayTasks(tasks);
            if (tg && tg.HapticFeedback) tg.HapticFeedback.impactOccurred('medium');
        }

        function deleteDayTask(id) {
            let tasks = getDayTasks();
            tasks = tasks.filter(t => t.id !== id);
            saveDayTasks(tasks);
        }

        function renderDayTasks() {
            const listEl = document.getElementById('day-tasks-list');
            let tasks = getDayTasks();
            if (tasks.length === 0) {
                listEl.innerHTML = `<p class="text-xs text-zinc-500 italic">Нет задач на этот день</p>`;
                return;
            }
            listEl.innerHTML = tasks.map(t => `
                <div class="bg-black/30 border border-white/5 rounded-xl p-2.5 flex justify-between items-center gap-2 ${t.completed ? 'opacity-50' : ''}">
                    <div class="flex items-center gap-2 flex-1 cursor-pointer" onclick="toggleDayTask(${t.id})">
                        <div class="w-4 h-4 rounded border ${t.completed ? 'bg-emerald-600 border-emerald-600 text-white text-[10px] flex items-center justify-center' : 'border-white/20'}">${t.completed ? '✓' : ''}</div>
                        <span class="text-xs ${t.completed ? 'line-through text-zinc-500' : 'text-zinc-200'}">${t.text}</span>
                    </div>
                    <button onclick="deleteDayTask(${t.id})" class="text-zinc-500 hover:text-red-400 text-xs px-1">✕</button>
                </div>
            `).join('');
        }

        // --- БАЗА ТРЕНИРОВОК ---
        function renderAllWorkouts() {
            const container = document.getElementById('all-workouts-list');
            const workouts = getWorkouts();
            container.innerHTML = workouts.map(w => `
                <div class="glass-panel rounded-xl p-3 flex justify-between items-center">
                    <div>
                        <span class="text-[10px] text-violet-400 uppercase font-bold">${w.tag || 'Своя'}</span>
                        <p class="text-sm font-bold text-white">${w.title}</p>
                    </div>
                    ${!w.isDefault ? `<button onclick="deleteWorkout('${w.id}')" class="text-zinc-500 hover:text-red-400 text-xs p-1">✕</button>` : ''}
                </div>
            `).join('');
        }

        function openAddWorkoutModal() { document.getElementById('add-workout-modal').classList.remove('hidden'); }
        function closeAddWorkoutModal() { document.getElementById('add-workout-modal').classList.add('hidden'); }

        function saveNewWorkout() {
            const name = document.getElementById('newWorkoutName').value.trim();
            const text = document.getElementById('newWorkoutExercises').value.trim();
            if (!name || !text) return;
            const exercises = text.split('\n').filter(Boolean);
            let custom = JSON.parse(localStorage.getItem('bp_custom_workouts') || '[]');
            custom.push({ id: 'custom_' + Date.now(), isDefault: false, title: name, tag: 'Своя', exercises });
            localStorage.setItem('bp_custom_workouts', JSON.stringify(custom));
            document.getElementById('newWorkoutName').value = '';
            document.getElementById('newWorkoutExercises').value = '';
            closeAddWorkoutModal();
            renderAllWorkouts();
        }

        function deleteWorkout(id) {
            let custom = JSON.parse(localStorage.getItem('bp_custom_workouts') || '[]');
            custom = custom.filter(w => w.id !== id);
            localStorage.setItem('bp_custom_workouts', JSON.stringify(custom));
            renderAllWorkouts();
        }

        // --- СТАТИСТИКА ---
        function renderHistoryManager() {
            const listEl = document.getElementById('history-manage-list');
            let history = JSON.parse(localStorage.getItem('bp_history') || '[]');
            if (history.length === 0) {
                listEl.innerHTML = `<p class="text-xs text-zinc-500 text-center py-2">Нет записанных тренировок</p>`;
                return;
            }
            listEl.innerHTML = history.slice(-5).reverse().map(item => `
                <div class="bg-black/30 border border-white/5 rounded-xl p-2.5 flex justify-between items-center text-xs">
                    <div>
                        <p class="font-bold text-zinc-200">${item.name}</p>
                        <p class="text-[10px] text-zinc-500">${item.date}</p>
                    </div>
                    <button onclick="deleteHistoryItem(${item.id})" class="text-zinc-500 hover:text-red-400 p-1 font-bold">✕</button>
                </div>
            `).join('');
        }

        function deleteHistoryItem(id) {
            let history = JSON.parse(localStorage.getItem('bp_history') || '[]');
            history = history.filter(h => h.id !== id);
            localStorage.setItem('bp_history', JSON.stringify(history));
            renderHistoryManager();
            renderCharts();
        }

        function renderCharts() {
            let history = JSON.parse(localStorage.getItem('bp_history') || '[]');
            let workoutsCount = history.filter(h => h.type === 'workout').length;

            const overallCtx = document.getElementById('overallChart').getContext('2d');
            if (overallChartInstance) overallChartInstance.destroy();
            overallChartInstance = new Chart(overallCtx, {
                type: 'doughnut',
                data: {
                    labels: ['Тренировки'],
                    datasets: [{ data: [workoutsCount], backgroundColor: ['#8b5cf6'], borderWidth: 0 }]
                },
                options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'bottom', labels: { color: '#a1a1aa', font: { size: 10 } } } } }
            });

            const dailyCtx = document.getElementById('dailyChart').getContext('2d');
            if (dailyChartInstance) dailyChartInstance.destroy();
            dailyChartInstance = new Chart(dailyCtx, {
                type: 'bar',
                data: {
                    labels: ['Пн', 'Вт', 'Ср', 'Чт', 'Пт', 'Сб', 'Вс'],
                    datasets: [{ label: 'Тренировки', data: [1, 0, 0, 1, 0, 0, 0], backgroundColor: '#10b981', borderRadius: 6 }]
                },
                options: { responsive: true, maintainAspectRatio: false, scales: { x: { ticks: { color: '#71717a' }, grid: { display: false } }, y: { ticks: { color: '#71717a', stepSize: 1 }, grid: { color: 'rgba(255,255,255,0.05)' } } }, plugins: { legend: { display: false } } }
            });
        }

        // Авто-запуск с выбора РЕАЛЬНОГО СЕГОДНЯШНЕГО ДНЯ
        selectDay(currentRealDayKey);
        renderAllWorkouts();
    </script>
</body>
</html>

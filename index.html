<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BACK PRIME</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Telegram Web App -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <!-- Chart.js для диаграмм -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        * { transition: transform 0.25s cubic-bezier(0.4, 0, 0.2, 1), border-color 0.25s ease; }
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-thumb { background: #dc2626; border-radius: 4px; }
        
        .glass-panel {
            background: rgba(20, 20, 26, 0.9);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.18);
            box-shadow: 0 12px 40px 0 rgba(0, 0, 0, 0.7), inset 0 1px 0 0 rgba(255, 255, 255, 0.12);
        }

        .glass-panel-active {
            background: rgba(30, 16, 18, 0.92);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(220, 38, 38, 0.65);
            box-shadow: 0 0 35px rgba(220, 38, 38, 0.4), inset 0 1px 0 0 rgba(255, 255, 255, 0.18);
        }

        @keyframes pulse-glow {
            0%, 100% { box-shadow: 0 0 25px rgba(220, 38, 38, 0.4); }
            50% { box-shadow: 0 0 55px rgba(220, 38, 38, 0.75); }
        }
        .active-workout-glow { animation: pulse-glow 2s infinite; }

        .tab-content {
            opacity: 0;
            transform: translateY(8px);
            transition: opacity 0.35s ease, transform 0.35s ease;
            position: absolute;
            width: 100%;
            pointer-events: none;
        }
        .tab-content.active {
            opacity: 1;
            transform: translateY(0);
            position: relative;
            pointer-events: auto;
        }

        #splash-screen {
            animation: splashFade 0.5s ease 1.5s forwards;
        }
        @keyframes splashFade {
            0% { opacity: 1; visibility: visible; }
            100% { opacity: 0; visibility: hidden; }
        }

        body {
            background: radial-gradient(circle at 50% 0%, #2a070c 0%, #0b0b0f 55%, #000000 100%);
            overflow-x: hidden;
        }
    </style>
</head>
<body class="text-zinc-100 font-sans min-h-screen p-4 pb-28 selection:bg-red-600 selection:text-white">

    <!-- СПЛЭШ-ЭКРАН -->
    <div id="splash-screen" class="fixed inset-0 bg-black z-50 flex flex-col items-center justify-center p-6 text-center">
        <div class="relative">
            <div class="absolute -inset-4 bg-red-600/30 rounded-full blur-xl animate-pulse"></div>
            <h1 class="relative text-4xl font-black tracking-widest uppercase text-white drop-shadow-[0_0_20px_rgba(220,38,38,0.8)]">
                BACK <span class="text-red-600">PRIME</span>
            </h1>
        </div>
        <p class="text-xs text-zinc-400 uppercase tracking-[0.3em] mt-3 font-bold animate-pulse">Загрузка системы...</p>
    </div>

    <div class="max-w-md mx-auto relative">
        <!-- Шапка -->
        <header class="flex justify-between items-center mb-3 mt-2">
            <div>
                <h1 class="text-2xl font-black tracking-widest uppercase text-white drop-shadow-md">BACK <span class="text-red-500">PRIME</span></h1>
                <p class="text-[10px] text-zinc-400 uppercase tracking-widest font-bold">Elite System v7.0</p>
            </div>
            <div id="system-status" class="glass-panel text-red-500 px-3 py-1 rounded-full text-xs font-black tracking-widest uppercase shadow-lg">
                ONLINE
            </div>
        </header>

        <!-- ЦИТАТНИК НАВЕРХУ (Лаконичный) -->
        <div class="glass-panel rounded-2xl p-3 mb-5 text-center relative overflow-hidden">
            <p id="motivational-quote" class="text-[11px] font-medium text-zinc-300 italic">
                Загрузка мотивации...
            </p>
        </div>

        <!-- Навигация -->
        <div class="grid grid-cols-3 gap-1.5 glass-panel p-1.5 rounded-2xl mb-6 relative z-10">
            <button onclick="switchTab('workouts')" id="tab-workouts" class="py-2.5 text-xs font-bold rounded-xl bg-gradient-to-r from-red-600 to-rose-600 text-white shadow-lg shadow-red-600/30 uppercase tracking-wider">План</button>
            <button onclick="switchTab('tasks')" id="tab-tasks" class="py-2.5 text-xs font-bold rounded-xl text-zinc-400 hover:text-white uppercase tracking-wider">Задачи</button>
            <button onclick="switchTab('stats')" id="tab-stats" class="py-2.5 text-xs font-bold rounded-xl text-zinc-400 hover:text-white uppercase tracking-wider">Статы</button>
        </div>

        <!-- КОНТЕЙНЕР ВКЛАДОК -->
        <div class="relative min-h-[500px]">
            
            <!-- ВКЛАДКА 1: ТРЕНИРОВКИ -->
            <div id="content-workouts" class="tab-content active space-y-4">
                
                <!-- Список тренировок (только названия) -->
                <div id="workouts-list-view" class="space-y-3">
                    <div class="flex justify-between items-center mb-1">
                        <h2 class="text-xs font-bold text-zinc-400 uppercase tracking-wider">Твои программы</h2>
                        <button onclick="openAddWorkoutModal()" class="text-xs text-red-500 hover:text-red-400 font-bold uppercase tracking-wider">＋ Создать</button>
                    </div>
                    <div id="workouts-container" class="space-y-2.5">
                        <!-- Рендерится динамически -->
                    </div>
                </div>

                <!-- Детальный просмотр / Активная тренировка (на весь экран при открытии) -->
                <div id="workout-detail-view" class="hidden space-y-4">
                    <button onclick="closeWorkoutDetail()" class="text-xs font-bold text-zinc-400 hover:text-white flex items-center gap-1 uppercase tracking-wider mb-2">
                        ← Назад к списку
                    </button>

                    <div id="active-workout-panel" class="hidden glass-panel-active rounded-2xl p-4 shadow-2xl active-workout-glow mb-4">
                        <div class="flex justify-between items-center mb-2">
                            <span class="text-xs font-black text-red-400 uppercase tracking-widest animate-pulse">● Таймер сессии</span>
                            <span id="workout-timer" class="text-xl font-mono font-black text-white">00:00</span>
                        </div>
                        <button onclick="finishActiveWorkout()" class="w-full bg-gradient-to-r from-red-600 to-rose-600 hover:from-red-500 hover:to-rose-500 active:scale-95 text-white font-bold py-2.5 rounded-xl transition shadow-lg shadow-red-600/40 uppercase tracking-wider text-xs">
                            ⏹ Завершить тренировку
                        </button>
                    </div>

                    <div class="glass-panel rounded-2xl p-5 shadow-xl space-y-4">
                        <div>
                            <span id="detail-tag" class="text-[10px] font-black text-red-400 uppercase tracking-widest">Программа</span>
                            <h2 id="detail-title" class="text-xl font-extrabold text-white mt-0.5">Название</h2>
                        </div>

                        <div id="exercises-tracker-list" class="space-y-3 pt-2 border-t border-zinc-800">
                            <!-- Упражнения со счетчиками подходов -->
                        </div>

                        <button id="start-workout-btn" onclick="startCurrentWorkout()" class="w-full bg-zinc-800/80 hover:bg-gradient-to-r hover:from-red-600 hover:to-rose-600 text-zinc-200 hover:text-white font-bold py-3 rounded-xl transition uppercase tracking-wider text-xs border border-zinc-700/60 hover:border-transparent shadow-md">
                            ▶ Начать тренировку
                        </button>
                    </div>
                </div>

                <!-- Модалка создания тренировки -->
                <div id="add-workout-modal" class="hidden glass-panel rounded-2xl p-5 shadow-2xl space-y-3 border-red-500/40">
                    <h3 class="text-sm font-bold text-white uppercase tracking-wider">Новая тренировка</h3>
                    <input type="text" id="newWorkoutName" placeholder="Название (например: День 3 • Руки)..." class="w-full bg-black/50 border border-zinc-700/60 rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:border-red-500 transition">
                    <textarea id="newWorkoutExercises" placeholder="Упражнения (каждое с новой строки):&#10;Бицепс с гантелями 3х10&#10;Французский жим 3х12" rows="4" class="w-full bg-black/50 border border-zinc-700/60 rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:border-red-500 transition"></textarea>
                    <div class="flex gap-2 pt-1">
                        <button onclick="saveNewWorkout()" class="flex-1 bg-red-600 hover:bg-red-500 text-white font-bold py-2.5 rounded-xl text-xs uppercase tracking-wider transition">Сохранить</button>
                        <button onclick="closeAddWorkoutModal()" class="px-4 bg-zinc-800 hover:bg-zinc-700 text-zinc-300 font-bold py-2.5 rounded-xl text-xs uppercase tracking-wider transition">Отмена</button>
                    </div>
                </div>

            </div>

            <!-- ВКЛАДКА 2: ЗАДАЧИ -->
            <div id="content-tasks" class="tab-content space-y-4">
                <div class="glass-panel rounded-2xl p-4 shadow-xl">
                    <h2 class="text-xs font-bold text-zinc-300 mb-3 uppercase tracking-wider">Новая задача</h2>
                    <div class="flex gap-2">
                        <input type="text" id="taskInput" placeholder="Написать код, почитать книгу..." class="flex-1 bg-black/50 border border-zinc-700/60 rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:border-red-500 transition">
                        <button onclick="addTask()" class="bg-gradient-to-r from-red-600 to-rose-600 hover:from-red-500 hover:to-rose-500 active:scale-95 text-white px-5 rounded-xl font-bold text-sm transition shadow-lg shadow-red-600/30">＋</button>
                    </div>
                </div>

                <div id="tasks-list" class="space-y-2.5">
                    <!-- Задачи рендерятся динамически -->
                </div>
            </div>

            <!-- ВКЛАДКА 3: СТАТИСТИКА И ДИАГРАММЫ -->
            <div id="content-stats" class="tab-content space-y-4">
                <div class="glass-panel rounded-2xl p-5 shadow-xl">
                    <h2 class="text-xs font-bold text-zinc-300 mb-4 uppercase tracking-wider text-center">Активность по дням</h2>
                    <div class="relative w-full h-56">
                        <canvas id="dailyChart"></canvas>
                    </div>
                </div>

                <div class="glass-panel rounded-2xl p-5 shadow-xl">
                    <h2 class="text-xs font-bold text-zinc-300 mb-4 uppercase tracking-wider text-center">Общий баланс задач и тренировок</h2>
                    <div class="relative w-full h-48 flex justify-center items-center">
                        <canvas id="overallChart"></canvas>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <!-- Логика приложения -->
    <script>

        tg.expand();

        // 100 МОТИВИРУЮЩИХ ФРАЗ
        const quotes = [

            "Глаза боятся, а руки делают.",

            "Только преодолевая сопротивление, мы растем.",
            "Твое будущее создается сегодня, а не завтра.",
            "Будь непреклонен перед лицом трудностей.",

            "Твоя уверенность строится на твоих победах над собой.",
            "Энергия, которую ты отдаешь делу, всегда возвращается.",
            "Преодолевай барьеры внутри своей головы.",
            "Только вперед, назад дороги нет.",
            "Настоящая сила кроется в умении не сдаваться.",
            "Твой рост начинается там, где заканчивается комфорт.",
            "Сделай невозможное своей новой нормой.",
            "Каждая победа над собой делает тебя непобедимым.",
            "Работай в тишине, пусть результат говорит за тебя.",
            "Твоя цель стоит любых усилий.",
            "Не бойся тяжелой работы, она приносит лучшие плоды.",
            "Сомнения убивают больше мечт, чем неудачи.",
            "Будь архитектором своей судьбы.",
            "Каждый день — это новая возможность стать лучше.",
            "Твое упорство — твой главный актив.",
            "Побеждает тот, кто не останавливается.",
            "Двигайся к цели даже маленькими шагами.",
            "Жизнь слишком коротка, чтобы тратить ее на сомнения.",
            "Создавай стандарты, а не следуй чужим.",
            "Твоя воля тверже стали.",
            "Каждый шаг вперед — это удар по твоим страхам.",
            "Не ищи легких путей, ищи сильные решения.",
            "Твоя настойчивость — ключ к любым закрытым дверям.",
            "Сильный не тот, кто не падает, а тот, кто встает.",
            "Возьми контроль над своей жизнью в свои руки.",
            "Каждое усилие окупается сторицей.",
            "Твои амбиции должны пугать твоих врагов и вдохновлять друзей.",
            "Иди вперед, даже если сомневаешься.",
            "Успех приходит к тем, кто действует.",
            "Твое тело способно на всё, осталось убедить разум.",
            "Каждое утро — новый шанс изменить всё.",
            "Не останавливайся на достигнутом, впереди еще больше.",
            "Будь лучшей версией самого себя.",
            "Твоя судьба в твоих руках.",
            "Дисциплина — ключ к абсолютной свободе.",
            "Каждый день доказывай себе, на что ты способен.",
            "Вперед к вершине BACK PRIME!"
        ];

        function setRandomQuote() {
            const randomIndex = Math.floor(Math.random() * quotes.length);
            document.getElementById('motivational-quote').innerText = `«${quotes[randomIndex]}»`;
        }
        setRandomQuote();
        setInterval(setRandomQuote, 15000);

        let dailyChartInstance = null;
        let overallChartInstance = null;
        let activeWorkout = null;
        let currentViewingWorkout = null;
        let timerInterval = null;

        const tabsOrder = ['workouts', 'tasks', 'stats'];
        let currentTab = 'workouts';

        function switchTab(tab) {
            currentTab = tab;
            tabsOrder.forEach(t => {
                const btn = document.getElementById(`tab-${t}`);
                const content = document.getElementById(`content-${t}`);
                if (t === tab) {
                    btn.className = "py-2.5 text-xs font-bold rounded-xl bg-gradient-to-r from-red-600 to-rose-600 text-white shadow-lg shadow-red-600/30 uppercase tracking-wider";
                    content.classList.add('active');
                } else {
                    btn.className = "py-2.5 text-xs font-bold rounded-xl text-zinc-400 hover:text-white uppercase tracking-wider";
                    content.classList.remove('active');
                }
            });
            if (tab === 'stats') {
                renderCharts();
            }
        }

        // Свайпы между вкладками
        let touchStartX = 0;
        let touchEndX = 0;
        document.addEventListener('touchstart', e => { touchStartX = e.changedTouches[0].screenX; }, { passive: true });
        document.addEventListener('touchend', e => {
            touchEndX = e.changedTouches[0].screenX;
            let diff = touchEndX - touchStartX;
            if (Math.abs(diff) > 70) {
                let currentIndex = tabsOrder.indexOf(currentTab);
                if (diff < 0 && currentIndex < tabsOrder.length - 1) {
                    switchTab(tabsOrder[currentIndex + 1]);
                    if (tg && tg.HapticFeedback) tg.HapticFeedback.selectionChanged();
                } else if (diff > 0 && currentIndex > 0) {
                    switchTab(tabsOrder[currentIndex - 1]);
                    if (tg && tg.HapticFeedback) tg.HapticFeedback.selectionChanged();
                }
            }
        }, { passive: true });

        // --- УПРАВЛЕНИЕ ТРЕНИРОВКАМИ ---
        const defaultWorkouts = [
            {
                id: 'gym',
                isDefault: true,
                title: '🏋️ Университет (Гантели + Тренажеры)',
                tag: 'День 1 • Универ',
                exercises: [
                    'Жим от груди в тренажере (3х8-12)',
                    'Верхняя тяга к груди (3х8-12)',
                    'Приседания с гантелями (3х10-12)',
                    'Румынская тяга с гантелями (3х10-12)',
                    'Махи гантелями в стороны (3х12-15)'
                ]
            },
            {
                id: 'home',
                isDefault: true,
                title: '🏠 Дом (Турник + Собственный вес)',
                tag: 'День 2 • Дом',
                exercises: [

                    'Отжимания от пола (4х12-20)',
                    'Болгарские выпады (3х10-12)',
                    'Планка (3х45-60 сек)',
                    'Скручивания на пресс (3х15-20)'
                ]
            }
        ];

        function getWorkouts() {
            let custom = JSON.parse(localStorage.getItem('bp_custom_workouts') || '[]');
            return [...defaultWorkouts, ...custom];
        }

        function renderWorkoutsList() {
            const container = document.getElementById('workouts-container');
            const workouts = getWorkouts();

            container.innerHTML = workouts.map(w => `
                <div class="glass-panel rounded-2xl p-4 flex justify-between items-center cursor-pointer hover:border-red-500/50 transition" onclick="openWorkoutDetail('${w.id}')">
                    <div>
                        <span class="text-[10px] font-black text-red-400 uppercase tracking-widest">${w.tag || 'Своя программа'}</span>
                        <h3 class="text-base font-extrabold text-white mt-0.5">${w.title}</h3>
                    </div>
                    ${!w.isDefault ? `<button onclick="event.stopPropagation(); deleteWorkout('${w.id}')" class="text-zinc-600 hover:text-red-500 p-2 text-xs">✕</button>` : '<span class="text-zinc-600 text-xs">➔</span>'}
                </div>
            `).join('');
        }

        function openWorkoutDetail(id) {
            const workouts = getWorkouts();
            const w = workouts.find(item => item.id == id);
            if (!w) return;
            currentViewingWorkout = w;

            document.getElementById('detail-title').innerText = w.title;
            document.getElementById('detail-tag').innerText = w.tag || 'Пользовательская';
            
            // Рендер упражнений с интерактивными счетчиками подходов
            const exList = document.getElementById('exercises-tracker-list');
            exList.innerHTML = w.exercises.map((ex, idx) => `
                <div class="bg-black/40 border border-zinc-800 rounded-xl p-3 flex flex-col gap-2">
                    <span class="text-sm font-medium text-zinc-200">${ex}</span>
                    <div class="flex items-center justify-between">
                        <span class="text-[10px] text-zinc-400 uppercase tracking-wider">Подходы:</span>
                        <div class="flex items-center gap-2" id="sets-counter-${idx}">
                            <button onclick="updateSet(${idx}, -1)" class="w-7 h-7 bg-zinc-800 hover:bg-zinc-700 text-white rounded-lg text-xs font-bold">-</button>
                            <span id="set-val-${idx}" class="text-sm font-black text-red-500 w-6 text-center">0</span>
                            <button onclick="updateSet(${idx}, 1)" class="w-7 h-7 bg-zinc-800 hover:bg-zinc-700 text-white rounded-lg text-xs font-bold">+</button>
                        </div>
                    </div>
                </div>
            `).join('');

            document.getElementById('workouts-list-view').classList.add('hidden');
            document.getElementById('workout-detail-view').classList.remove('hidden');
        }

        function closeWorkoutDetail() {
            if (activeWorkout) return; // если идет тренировка, не даем выйти просто так
            document.getElementById('workout-detail-view').classList.add('hidden');
            document.getElementById('workouts-list-view').classList.remove('hidden');
        }

        // Интерактивные сеты
        let exerciseSets = {};
        function updateSet(idx, delta) {
            if (!exerciseSets[idx]) exerciseSets[idx] = 0;
            exerciseSets[idx] = Math.max(0, exerciseSets[idx] + delta);
            document.getElementById(`set-val-${idx}`).innerText = exerciseSets[idx];
            if (tg && tg.HapticFeedback) tg.HapticFeedback.selectionChanged();
        }

        function openAddWorkoutModal() {
            document.getElementById('add-workout-modal').classList.remove('hidden');
        }
        function closeAddWorkoutModal() {
            document.getElementById('add-workout-modal').classList.add('hidden');
        }

        function saveNewWorkout() {
            const name = document.getElementById('newWorkoutName').value.trim();
            const text = document.getElementById('newWorkoutExercises').value.trim();
            if (!name || !text) return;

            const exercises = text.split('\n').filter(Boolean);
            let custom = JSON.parse(localStorage.getItem('bp_custom_workouts') || '[]');
            custom.push({
                id: 'custom_' + Date.now(),
                isDefault: false,
                title: name,
                tag: 'Своя программа',
                exercises
            });
            localStorage.setItem('bp_custom_workouts', JSON.stringify(custom));

            document.getElementById('newWorkoutName').value = '';
            document.getElementById('newWorkoutExercises').value = '';
            closeAddWorkoutModal();
            renderWorkoutsList();
        }

        function deleteWorkout(id) {
            if (!confirm('Удалить эту тренировку?')) return;
            let custom = JSON.parse(localStorage.getItem('bp_custom_workouts') || '[]');
            custom = custom.filter(w => w.id !== id);
            localStorage.setItem('bp_custom_workouts', JSON.stringify(custom));
            renderWorkoutsList();
        }

        // Запуск сессии тренировки
        function startCurrentWorkout() {
            if (!currentViewingWorkout) return;
            activeWorkout = { name: currentViewingWorkout.title, startTime: Date.now() };
            exerciseSets = {};

            document.getElementById('active-workout-panel').classList.remove('hidden');
            document.getElementById('start-workout-btn').classList.add('hidden');

            if (tg && tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');

            clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                let seconds = Math.floor((Date.now() - activeWorkout.startTime) / 1000);
                let mins = Math.floor(seconds / 60).toString().padStart(2, '0');
                let secs = (seconds % 60).toString().padStart(2, '0');
                document.getElementById('workout-timer').innerText = `${mins}:${secs}`;
            }, 1000);
        }

        function finishActiveWorkout() {
            if (!activeWorkout) return;
            
            clearInterval(timerInterval);
            let history = JSON.parse(localStorage.getItem('bp_history') || '[]');
            history.push({ type: 'workout', name: activeWorkout.name, date: new Date().toISOString().split('T')[0] });
            localStorage.setItem('bp_history', JSON.stringify(history));

            document.getElementById('active-workout-panel').classList.add('hidden');
            document.getElementById('start-workout-btn').classList.remove('hidden');
            document.getElementById('workout-detail-view').classList.add('hidden');
            document.getElementById('workouts-list-view').classList.remove('hidden');

            if (tg && tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
            
            activeWorkout = null;
            switchTab('stats');
        }

        // --- ЗАДАЧИ ---
        function getTasks() { return JSON.parse(localStorage.getItem('bp_tasks') || '[]'); }
        function saveTasks(tasks) { localStorage.setItem('bp_tasks', JSON.stringify(tasks)); renderTasks(); }

        function addTask() {
            const input = document.getElementById('taskInput');
            const text = input.value.trim();
            if (!text) return;
            let tasks = getTasks();
            tasks.unshift({ id: Date.now(), text, completed: false, date: new Date().toISOString().split('T')[0] });
            input.value = '';
            saveTasks(tasks);
        }

        function toggleTaskStatus(id) {
            let tasks = getTasks();
            tasks = tasks.map(t => { if (t.id === id) t.completed = !t.completed; return t; });
            saveTasks(tasks);
            if (tg && tg.HapticFeedback) tg.HapticFeedback.impactOccurred('medium');
        }

        function deleteTask(id) {
            let tasks = getTasks();
            tasks = tasks.filter(t => t.id !== id);
            saveTasks(tasks);
            if (tg && tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('warning');
        }

        function renderTasks() {
            const listEl = document.getElementById('tasks-list');
            const tasks = getTasks();
            if (tasks.length === 0) {
                listEl.innerHTML = `<div class="text-center py-12 text-zinc-500 text-xs uppercase tracking-widest font-medium">Список задач пуст</div>`;
                return;
            }
            listEl.innerHTML = tasks.map(t => `
                <div class="glass-panel rounded-2xl p-4 flex justify-between items-center gap-3 shadow-md ${t.completed ? 'opacity-50' : ''}">
                    <div class="flex items-center gap-3 flex-1">
                        <span class="text-sm font-medium ${t.completed ? 'line-through text-zinc-400' : 'text-zinc-200'}">${t.text}</span>
                    </div>
                    <div class="flex items-center gap-2">
                        <button onclick="toggleTaskStatus(${t.id})" class="w-9 h-9 rounded-xl ${t.completed ? 'bg-emerald-600 text-white shadow-lg shadow-emerald-600/30' : 'bg-zinc-800 text-zinc-400 hover:bg-zinc-700'} flex items-center justify-center font-bold transition active:scale-95">✓</button>
                        <button onclick="deleteTask(${t.id})" class="w-9 h-9 rounded-xl bg-zinc-800 text-zinc-400 hover:bg-red-600 hover:text-white flex items-center justify-center font-bold transition active:scale-95">✕</button>
                    </div>
                </div>
            `).join('');
        }

        // --- СТАТИСТИКА И ДИАГРАММЫ ---
        function renderCharts() {
            const tasks = getTasks();
            const history = JSON.parse(localStorage.getItem('bp_history') || '[]');

            const completedTasksCount = tasks.filter(t => t.completed).length;
            const pendingTasksCount = tasks.filter(t => !t.completed).length;
            const workoutsCount = history.filter(h => h.type === 'workout').length;

            const overallCtx = document.getElementById('overallChart').getContext('2d');
            if (overallChartInstance) overallChartInstance.destroy();

            overallChartInstance = new Chart(overallCtx, {
                type: 'doughnut',
                data: {
                    labels: ['Выполнено', 'В ожидании', 'Тренировки'],
                    datasets: [{
                        data: [completedTasksCount, pendingTasksCount, workoutsCount],
                        backgroundColor: ['#16a34a', '#3f3f46', '#dc2626'],
                        borderColor: 'transparent',
                        borderWidth: 0
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { position: 'bottom', labels: { color: '#a1a1aa', font: { size: 10, weight: 'bold' } } } }
                }
            });

            const days = [];
            const completedData = [];
            const pendingData = [];

            for (let i = 4; i >= 0; i--) {
                let d = new Date();
                d.setDate(d.getDate() - i);
                let dateStr = d.toISOString().split('T')[0];
                let label = d.toLocaleDateString('ru-RU', { weekday: 'short', day: 'numeric' });
                days.push(label);

                let dayTasks = tasks.filter(t => t.date === dateStr);
                completedData.push(dayTasks.filter(t => t.completed).length);
                pendingData.push(dayTasks.filter(t => !t.completed).length);
            }

            const dailyCtx = document.getElementById('dailyChart').getContext('2d');
            if (dailyChartInstance) dailyChartInstance.destroy();

            dailyChartInstance = new Chart(dailyCtx, {
                type: 'bar',
                data: {
                    labels: days,
                    datasets: [
                        { label: 'Выполнено', data: completedData, backgroundColor: '#16a34a', borderRadius: 6 },
                        { label: 'Не выполнено', data: pendingData, backgroundColor: '#dc2626', borderRadius: 6 }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: {
                        x: { stacked: true, ticks: { color: '#71717a', font: { size: 10 } }, grid: { display: false } },
                        y: { stacked: true, ticks: { color: '#71717a', font: { size: 10 }, stepSize: 1 }, grid: { color: 'rgba(255,255,255,0.05)' } }
                    },
                    plugins: { legend: { position: 'bottom', labels: { color: '#a1a1aa', font: { size: 10, weight: 'bold' } } } }
                }
            });
        }

        renderWorkoutsList();
        renderTasks();
    </script>
</body>
</html>
